<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none';">
  <title>MultiForge · Redirecionamento</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0E1114;
      color: #EDEFF2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #161A20;
      border: 1px solid #282E38;
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      background: #242A35;
      color: #9CA3AF;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 10px;
      color: #F3F4F6;
    }
    p {
      margin: 0 0 20px;
      color: #9CA3AF;
      font-size: 14px;
      line-height: 1.5;
    }
    .actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    .btn {
      display: inline-block;
      text-align: center;
      padding: 9px 16px;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: #2563EB;
      color: #fff;
    }
    .btn-secondary {
      background: transparent;
      border-color: #374151;
      color: #D1D5DB;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #2563EB;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card" id="cardBox">
    <div class="spinner" id="spinner"></div>
    <div style="text-align:center;">
      <h1 id="titleText">Redirecionando...</h1>
      <p id="descText">Validando rota segura.</p>
    </div>
  </div>

  <script>
    (function () {
      var ROUTES = {
          "motoboy": "https://anthor-server-1.tail3916ee.ts.net/motoboy",
          "cozinha": "https://anthor-server-1.tail3916ee.ts.net/cozinha",
          "painel": "https://anthor-server-1.tail3916ee.ts.net/cozinha",
          "qrcode": "https://anthor-server-1.tail3916ee.ts.net/qrcode",
          "alexa": "https://anthor-server-1.tail3916ee.ts.net/cozinha",
          "server": "https://anthor-server-1.tail3916ee.ts.net"
        };

      // Allowlist dinâmica derivada automaticamente das rotas oficiais (routes.json)
      function getAllowedHosts() {
        var hosts = ["multi-forge.github.io"];
        Object.keys(ROUTES).forEach(function (k) {
          try {
            var h = new URL(ROUTES[k]).hostname.toLowerCase();
            if (hosts.indexOf(h) === -1) hosts.push(h);
          } catch (e) {}
        });
        return hosts;
      }

      var SAFE_PARAMS = ["p", "id", "code", "platform"];

      function isAllowedDestination(urlStr) {
        try {
          var parsed = new URL(urlStr);
          if (parsed.protocol !== "https:") return false;
          return getAllowedHosts().indexOf(parsed.hostname.toLowerCase()) !== -1;
        } catch (e) {
          return false;
        }
      }

      function forward(targetUrl) {
        if (!isAllowedDestination(targetUrl)) {
          showError("Destino bloqueado", "O endereço solicitado não pertence à lista de domínios autorizados.");
          return;
        }
        try {
          var dest = new URL(targetUrl);
          var curr = new URL(location.href);
          curr.searchParams.forEach(function (v, k) {
            if (SAFE_PARAMS.indexOf(k) !== -1 && String(v).length <= 64) {
              dest.searchParams.set(k, v);
            }
          });
          location.replace(dest.toString());
        } catch (e) {
          location.replace(targetUrl);
        }
      }

      function showError(title, message) {
        var sp = document.getElementById("spinner");
        if (sp) sp.style.display = "none";
        var card = document.getElementById("cardBox");
        card.innerHTML = '';
        var tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = "Gateway Seguro";
        var h1 = document.createElement("h1");
        h1.textContent = title || "Atalho não encontrado";
        var p = document.createElement("p");
        p.textContent = message || "O endereço acessado não existe ou foi desativado.";
        var actions = document.createElement("div");
        actions.className = "actions";
        var a1 = document.createElement("a");
        a1.href = "/motoboy";
        a1.className = "btn btn-primary";
        a1.textContent = "Check-in de Entregador";
        var a2 = document.createElement("a");
        a2.href = "/";
        a2.className = "btn btn-secondary";
        a2.textContent = "Início";
        actions.appendChild(a1);
        actions.appendChild(a2);
        card.appendChild(tag);
        card.appendChild(h1);
        card.appendChild(p);
        card.appendChild(actions);
      }

      // 1. Parâmetro ?to= validado estritamente contra ALLOWED_HOSTS
      var params = new URLSearchParams(location.search);
      var queryDest = params.get("to") || params.get("url");
      if (queryDest) {
        forward(queryDest);
        return;
      }

      // 2. Extração segura do slug
      var parts = location.pathname.split("/").filter(Boolean);
      var slug = parts.length > 0 ? parts[parts.length - 1].toLowerCase().replace(/[^a-z0-9_-]/g, "") : "";

      if (slug && Object.prototype.hasOwnProperty.call(ROUTES, slug)) {
        forward(ROUTES[slug]);
        return;
      }

      // 3. Fallback assíncrono em routes.json
      fetch("/routes.json", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && typeof data === "object") {
            ROUTES = Object.assign(ROUTES, data);
            if (slug && Object.prototype.hasOwnProperty.call(data, slug)) {
              forward(data[slug]);
              return;
            }
          }
          showError("Atalho não encontrado", "Verifique o QR Code escaneado ou acesse o check-in de entregadores.");
        })
        .catch(function () {
          showError("Atalho não encontrado", "Verifique o QR Code escaneado ou acesse o check-in de entregadores.");
        });
    })();
  </script>
</body>
</html>
