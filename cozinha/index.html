<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Redirecionando...</title>
  <meta http-equiv="refresh" content="0; url=https://anthor-server.tail3916ee.ts.net/cozinha">
  <link rel="canonical" href="https://anthor-server.tail3916ee.ts.net/cozinha">
  <script>
    (function() {
      var base = "https://anthor-server.tail3916ee.ts.net/cozinha";
      try {
        var dest = new URL(base, location.origin);
        var curr = new URL(location.href);
        curr.searchParams.forEach(function(v, k) { dest.searchParams.set(k, v); });
        if (curr.hash) dest.hash = curr.hash;
        location.replace(dest.toString());
      } catch(e) {
        location.replace(base + location.search + location.hash);
      }
    })();
  </script>
  <style>
    body {
      margin: 0;
      background: #0E1114;
      color: #EDEFF2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;

    .box {
      border: 1px solid #282E38;
      background: #161A20;
      padding: 24px 32px;
      border-radius: 8px;
      text-align: center;
      max-width: 480px;
    }
    a { color: #60A5FA; text-decoration: none; word-break: break-all; }
  </style>
</head>
